strategy:
  name: fx_swing_trend_reclaim_v1
  version: intraday_long_short_demo_validation_ig6_fixed_tp_6pips
  status: demo_validation_only
  market: GBPUSD
  direction_mode: long_short
  broker_target: IG
  pip_size: 0.0001
  source_timezone: UTC
  production_ready: false
  live_trading_approved: false

timeframes:
  trend_timeframe: 4H
  signal_timeframe: 1H
  execution_timeframe: tick

indicators:
  ema_fast: 20
  ema_mid: 50
  ema_slow: 200
  rsi_period: 14
  atr_period: 14

entry_rules:
  trend_filter:
    enabled: true
    rules:
      - long: 4H close above EMA200
      - short: 4H close below EMA200
  signal_filter:
    enabled: true
    rules:
      - long: 1H close above EMA50, pullback near EMA20/EMA50 within 1.2 ATR, RSI14 above 50 and rising, bullish candle close
      - short: 1H close below EMA50, pullback near EMA20/EMA50 within 1.2 ATR, RSI14 below 50 and falling, bearish candle close
      - enter on next available tick after signal candle close
  allowed_sessions:
    - {name: Tokyo, start: "09:00", end: "18:00", timezone: Asia/Tokyo}
    - {name: London morning, start: "07:00", end: "11:30", timezone: Europe/London}
    - {name: London New York overlap, start: "13:00", end: "16:30", timezone: Europe/London}

execution:
  use_bid_ask: true
  short_entry_price: bid
  short_exit_price: ask
  long_entry_price: ask
  long_exit_price: bid
  allow_mid_for_indicators_only: true
  enter_after_signal_close: true
  max_open_positions: 1
  allow_pyramiding: false
  allow_averaging_down: false
  allow_martingale: false
  default_slippage_price_points: 0.005

stop_loss:
  method: max_of_swing_and_atr
  atr_multiplier: 1.5
  swing_lookback_candles: 8
  swing_buffer_atr_multiplier: 0.20

risk_management:
  risk_per_trade_percent: 0.25
  maximum_trade_duration_days: 1
  fixed_take_profit_pips: 6.0
  take_profit_execution_mode: attached_limit
  move_to_breakeven_after_r: 1.2
  partial_take_profit_r: 2.0
  partial_take_profit_percent: 50
  final_target_r: 4.0
  trailing_atr_enabled: false
  trailing_atr_multiplier: 1.5

broker_guardrails:
  broker: IG
  selected_guardrail_candidate: intraday_long_short_ig_realistic_risk025_ig6_fixed_tp_6pips
  min_stop_distance_pips: 6.0
  min_take_profit_distance_pips: 6.0
  min_initial_risk_pips: 6.0
  reject_initial_risk_below_minimum: true
  validate_against_executable_entry_tick: true

spread_guardrails:
  track_entry_spread: true
  track_exit_spread: true
  track_spread_to_risk_ratio: true
  signal_spread_reject_above_pips: 2.0
  warn_spread_to_risk_ratio_above: 0.20
  reject_spread_to_risk_ratio_above: 0.20

time_guards:
  broker_timezone: Europe/London
  block_new_entries_after: "21:30"
  overnight_funding_cutoff: "22:00"
  intraday_force_close_enabled: true
  intraday_force_close_before: "21:55"

weekend_policy:
  name: force_close_friday_20_30
  enabled: true
  force_close_friday: true
  close_time_utc: "20:30"
  block_weekend_holding: true

funding_awareness:
  enabled: true
  track_overnight_funding: false
  cutoff_time_uk: "22:00"
  apply_wednesday_triple_rollover: true
  funding_rate_source: configurable_research_assumption
  fetch_live_rates: false

news_guard:
  enabled: true
  calendar_file: data/macro_calendar/gbp_usd_events_live_nasdaq.csv
  affected_currencies: [GBP, USD]
  impact_levels: [HIGH]
  before_minutes: 60
  after_minutes: 60
  block_new_entries: true
  close_existing_positions: false
  log_skipped_signals: true

trade_lifecycle:
  enabled: true
  stop_amend_min_interval_seconds: 10
  stop_amend_min_move_pips: 1.0
  stop_amend_skip_log_interval_seconds: 60
  max_stop_amends_per_minute: 4
  max_stop_amends_per_trade: 50

validation_status:
  research_candidate: intraday_6pip_attached_risk025_ig6
  backtest: STRONG
  monte_carlo: STRONG_STRESS_RESILIENCE
  overnight_funding_exposure: none_by_intraday_policy
  demo_validation_required_before_order: true

candidate_decision:
  selected_for_demo_validation: intraday_6pip_attached_risk025_ig6
  rationale: Fixed 6-pip attached take-profit cleared current IG DEMO 6-pip stop/limit guardrails, retained strong news-guarded historical performance, and passed Monte Carlo/execution stress.

research_boundary:
  purpose: Versioned DEMO validation contract for the intraday long/short 6-pip attached take-profit candidate.
  not_live_approval: true
  requires_human_confirmation_before_order_execution: true
