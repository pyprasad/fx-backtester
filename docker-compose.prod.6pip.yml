services:
  usdjpy-6pip-prod-bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env.prod
    environment:
      PYTHONPATH: /app
      STRICT_CONFIG: config/strategies/usdjpy_fx_swing_trend_reclaim_v1_intraday_6pip_attached_demo.yaml
      RUNTIME_CONFIG: config/strategy.usdjpy.fx_swing_trend_reclaim.yaml
      EPIC: CS.D.USDJPY.TODAY.IP
      # 0 means always-on. Session filters and intraday guards decide when entries are allowed.
      BOT_DURATION_SECONDS: "0"
      BOT_POLL_SECONDS: "5"
      BOT_HISTORY_POINTS: "1000"
      BOT_REFRESH_POINTS: "5"
      BOT_CACHE_PATH: data/live_cache/ig_6pip_prod
      NEWS_GUARD_CALENDAR_FILE: data/macro_calendar/usd_jpy_events_live_nasdaq.csv
      NEWS_GUARD_FORWARD_DAYS: "21"
      NEWS_GUARD_MIN_FORWARD_DAYS: "7"
      NEWS_GUARD_CALENDAR_REFRESH_ENABLED: "true"
      NEWS_GUARD_REFRESH_MINUTES_BEFORE_SESSION: "30"
      NEWS_GUARD_PRUNE_RETENTION_HOURS: "24"
      NEWS_GUARD_CACHE_DIR: data/macro_calendar/cache/nasdaq_live
      # Explicit LIVE order placement. Keep .env.prod pointed at the intended IG LIVE account.
      IG_ENV: LIVE
      IG_ACC_TYPE: LIVE
      IG_REST_BASE_URL: https://api.ig.com/gateway/deal
      BOT_CONFIRM: "PLACE_LIVE_ORDER"
      IG_ORDER_EXECUTION_ENABLED: "true"
      IG_DRY_RUN_ONLY: "false"
      IG_STREAMING_MODE: CHART_TICK
      IG_AUDIT_OUTPUT_PATH: reports/ig_prod_audit_6pip
      IG_TICK_OUTPUT_PATH: data/live_prod_ticks/usdjpy_6pip
      IG_TOKEN_CACHE_PATH: .runtime/ig_prod_6pip_session.json
      IG_HISTORICAL_TOKEN_CACHE_PATH: .runtime/ig_prod_6pip_historical_session.json
      TELEGRAM_ENABLED: "false"
      TELEGRAM_CONTROL_PATH: .runtime/ig_6pip_prod_bot_control.json
      TELEGRAM_STATUS_PATH: reports/ig_prod_audit_6pip/bot_run_usdjpy.json
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ig_6pip_prod_runtime:/app/.runtime
      - ./config:/app/config:ro
      - ./.env.prod:/app/.env.prod:ro
    command: >
      sh -c 'python scripts/ensure_live_usdjpy_macro_calendar.py
      --output "$$NEWS_GUARD_CALENDAR_FILE"
      --forward-days "$$NEWS_GUARD_FORWARD_DAYS"
      --min-forward-days "$$NEWS_GUARD_MIN_FORWARD_DAYS"
      && python -m src.main ig-demo-run-bot
      --env-file .env.prod
      --strategy-config "$$STRICT_CONFIG"
      --runtime-strategy-config "$$RUNTIME_CONFIG"
      --epic "$$EPIC"
      --history-points "$$BOT_HISTORY_POINTS"
      --refresh-points "$$BOT_REFRESH_POINTS"
      --cache-path "$$BOT_CACHE_PATH"
      --duration-seconds "$$BOT_DURATION_SECONDS"
      --poll-seconds "$$BOT_POLL_SECONDS"
      --confirm "$$BOT_CONFIRM"'
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  ig_6pip_prod_runtime:
